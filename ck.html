
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modal Template Collection</title>
    
    <!-- ==================================================================================
         LIBRARIES (Do not touch / 変更しないでください)
         ================================================================================== -->
    <!-- Tailwind CSS: Styling Framework -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel: Allows JSX (React code) to run directly in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons: For the cute icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
      }
    </script>
    
    <!-- Fonts: Noto Sans JP (Text) & Caveat (Handwriting) -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <style>
      body { font-family: 'Noto Sans JP', sans-serif; }
      .font-handwriting { font-family: 'Caveat', cursive; }

      /* Animation Utilities */
      .modal-content { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-out; }
      
      /* Hardware Acceleration for smooth animations */
      .hardware-accel { will-change: transform, opacity; backface-visibility: hidden; transform: translateZ(0); }

      /* Scrollbar Styling */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Prevent selecting text when dragging */
      .noselect { user-select: none; -webkit-user-select: none; }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-stone-100 h-screen w-screen overflow-x-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef } from 'react';
      import { createRoot } from 'react-dom/client';
      import { X, ChevronLeft, ChevronRight, LayoutTemplate, Camera, ScrollText, ArrowRight, Square, Columns, Layers } from 'lucide-react';

      // ==================================================================================
      // 🟢 🟢 🟢  EDIT AREA / 配置区 / 編集エリア  🟢 🟢 🟢
      // ==================================================================================
      // 这里的设置会应用到所有的弹窗样式中。
      // ここでの設定はすべてのモーダルスタイルに適用されます。

      const CONTENT_CONFIG = {
        // [1] Title & Short Description / 标题与短描述
        // Used in Style 2, 5, 6
        title: "Tokyo Street Snap", 
        description: `这是示例文本。可以编辑此部分。これはサンプルテキストです。ここを編集できます。`,
        
        // [2] Long Article Content / 长文章内容
        // Used primarily in Style 4 (Blog) and Style 6 (Overlay)
        longContent: `Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. 
        
在此处输入长篇文章内容。这个部分适合用于博客样式或者详情页样式。
Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.

(Style 4 和 Style 6 支持滚动查看更多内容)`,

        // [3] Image Slides / 图片轮播配置
        // id: 序号
        // color: 背景颜色代码 (使用 Tailwind CSS 类名, 如 bg-red-500)
        // label: 图片中心的文字
        // caption: 图片底部的说明文字 (用于拍立得样式)
        slides: [
          { id: 1, color: 'bg-rose-300', label: 'Sakura', caption: 'Spring 2024 ❤️' },
          { id: 2, color: 'bg-sky-300', label: 'Sky', caption: 'Blue Sky in Shibuya' },
          { id: 3, color: 'bg-emerald-300', label: 'Park', caption: 'Picnic Day!' },
          { id: 4, color: 'bg-amber-300', label: 'Cafe', caption: 'Coffee Time' },
          { id: 5, color: 'bg-violet-300', label: 'Night', caption: 'Neon Lights' },
        ]
      };

      // ==================================================================================
      // 🔴 🔴 🔴  SYSTEM AREA (LOGIC) / 逻辑区 (勿动) / システムエリア (変更禁止)  🔴 🔴 🔴
      // ==================================================================================

      // ----------------------------------------------------------------------------------
      // 1. Helper Components (Close Buttons)
      // ----------------------------------------------------------------------------------

      // Style 1 & 5: Simple Grey
      const SimpleClose = ({ onClick, className = "top-4 right-4 text-gray-400 hover:text-gray-800" }) => (
        <button onClick={onClick} className={`absolute z-50 p-2 transition-colors ${className}`}>
          <X size={24} />
        </button>
      );

      // Style 2: Floating Glass
      const CardClose = ({ onClick }) => (
        <button onClick={onClick} className="absolute top-4 right-4 z-50 p-2 bg-white/50 hover:bg-white rounded-full text-gray-600 transition-all shadow-sm backdrop-blur-md">
          <X size={20} />
        </button>
      );

      // Style 3: Polaroid Fixed (Top-Right of Container)
      const PolaroidClose = ({ onClick }) => (
        <button onClick={onClick} className="absolute -top-12 -right-4 sm:-right-12 z-50 bg-stone-100 text-stone-400 hover:text-rose-500 rounded-full p-2 hover:bg-white shadow-sm transition-all border border-stone-200">
           <X size={24} strokeWidth={2.5} />
        </button>
      );

      // Style 4: Minimal Floating
      const BlogClose = ({ onClick }) => (
        <button onClick={onClick} className="absolute top-6 right-6 z-50 p-3 bg-white hover:bg-gray-100 text-gray-800 rounded-full shadow-lg transition-transform hover:scale-105 border border-gray-100">
          <X size={24} />
        </button>
      );

      // Style 6: Overlay Small Button
      const OverlayClose = ({ onClick }) => (
        <button onClick={onClick} className="absolute top-4 right-4 z-50 p-2 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-full shadow-md transition-colors">
          <X size={20} />
        </button>
      );


      // ----------------------------------------------------------------------------------
      // 2. Core Components (Carousel)
      // ----------------------------------------------------------------------------------

      const Carousel = ({ className = "", rounded = "rounded-none", indicatorClass = "bottom-4", slideColorClass = "", arrowClass = "", arrowStyle = {} }) => {
        const [current, setCurrent] = useState(0);
        const slides = CONTENT_CONFIG.slides;
        const next = (e) => { e?.stopPropagation(); setCurrent((c) => (c + 1) % slides.length); };
        const prev = (e) => { e?.stopPropagation(); setCurrent((c) => (c - 1 + slides.length) % slides.length); };

        return (
          <div className={`relative overflow-hidden group h-full w-full ${rounded} ${className}`}>
            <div className={`w-full h-full flex items-center justify-center text-white text-4xl font-bold transition-all duration-500 ${slideColorClass ? slideColorClass : slides[current].color}`}>
              {slides[current].label}
            </div>
            
            {/* Arrows */}
            <button 
              onClick={prev} 
              style={arrowStyle}
              className={`absolute left-4 -translate-y-1/2 p-3 bg-black/10 hover:bg-black/30 backdrop-blur-sm rounded-full text-white opacity-0 group-hover:opacity-100 transition-all transform hover:scale-110 z-20 ${arrowClass}`}
            >
              <ChevronLeft size={24} />
            </button>
            <button 
              onClick={next} 
              style={arrowStyle}
              className={`absolute right-4 -translate-y-1/2 p-3 bg-black/10 hover:bg-black/30 backdrop-blur-sm rounded-full text-white opacity-0 group-hover:opacity-100 transition-all transform hover:scale-110 z-20 ${arrowClass}`}
            >
              <ChevronRight size={24} />
            </button>

            {/* Dots */}
            <div className={`absolute ${indicatorClass} left-0 right-0 flex justify-center gap-2 z-10`}>
              {slides.map((_, idx) => (
                <button 
                  key={idx} 
                  onClick={(e) => { e.stopPropagation(); setCurrent(idx); }}
                  className={`h-2 rounded-full transition-all shadow-sm ${current === idx ? 'w-8 bg-white' : 'w-2 bg-white/60 hover:bg-white/80'}`} 
                />
              ))}
            </div>
          </div>
        );
      };

      // ----------------------------------------------------------------------------------
      // 3. Style Templates (The 6 Designs)
      // ----------------------------------------------------------------------------------

      // --- STYLE 1: Blank Canvas / 空白画板 ---
      const StyleBlank = ({ onClose }) => (
        <div className="relative flex flex-col items-center justify-center h-[600px] w-full bg-white rounded-xl shadow-xl">
          <SimpleClose onClick={onClose} />
          <Square size={48} className="mb-4 opacity-20" />
          <p className="text-lg font-medium">Blank Canvas</p>
          <p className="text-sm opacity-60">Custom Layout Ready</p>
        </div>
      );

      // --- STYLE 2: Classic Card / 经典卡片 ---
      const StyleClassic = ({ onClose }) => (
        <div className="relative flex flex-col bg-[#f0f0f0] h-full w-full rounded-2xl shadow-2xl overflow-hidden">
          <div className="relative p-6 pb-0 h-[450px]">
             <CardClose onClick={onClose} />
             <Carousel className="w-full h-full shadow-sm" rounded="rounded-2xl" arrowClass="top-1/2" />
          </div>
          <div className="p-8">
            <h2 className="text-3xl font-bold text-gray-800 mb-3 tracking-tight">{CONTENT_CONFIG.title}</h2>
            <div className="h-1 w-12 bg-gray-300 mb-4 rounded-full"></div>
            <div className="text-gray-600 text-lg leading-relaxed whitespace-pre-wrap font-medium">
              {CONTENT_CONFIG.description}
            </div>
          </div>
        </div>
      );

      // --- STYLE 3: Polaroid / 拍立得 (White, Infinite Stack) ---
      const StylePolaroid = ({ onClose }) => {
        const [activeIndex, setActiveIndex] = useState(0);
        const [isAnimating, setIsAnimating] = useState(false);
        const slides = CONTENT_CONFIG.slides;

        const handleNext = (e) => {
          e.stopPropagation();
          if (isAnimating) return;
          setIsAnimating(true);
          
          setTimeout(() => {
            setActiveIndex((prev) => (prev + 1) % slides.length);
            setIsAnimating(false);
          }, 500); // Animation duration
        };

        // Logic: 
        // Always render 3 cards: Top, Mid, Bot.
        // When clicking, Top flies away, Mid becomes Top, Bot becomes Mid.
        // The data index shifts after animation to create infinite loop.
        const slideTop = slides[activeIndex];
        const slideMid = slides[(activeIndex + 1) % slides.length];
        const slideBot = slides[(activeIndex + 2) % slides.length];

        const PolaroidCard = ({ slide, zIndex, transformClass, transitionClass, opacityClass = "opacity-100" }) => (
           <div 
            className={`absolute top-0 left-0 right-0 h-full bg-white p-3 pb-14 shadow-xl flex flex-col hardware-accel origin-bottom rounded-lg border border-stone-100 ${transitionClass} ${zIndex} ${transformClass} ${opacityClass}`}
           >
             <div className={`w-full h-full ${slide.color} flex items-center justify-center mb-4 relative overflow-hidden rounded-[2px] shadow-inner`}>
                <span className="text-white font-bold tracking-widest uppercase text-2xl drop-shadow-md z-10">{slide.label}</span>
             </div>
             <div className="absolute bottom-4 left-0 right-0 text-center px-4">
               <p className="font-handwriting text-2xl text-stone-700 tracking-wide truncate">{slide.caption}</p>
             </div>
           </div>
        );

        return (
          <div className="relative flex flex-col items-center justify-center h-[600px] w-full perspective-1000">
             <div className="relative w-72 h-96 sm:w-80 sm:h-[420px]"> 
                {/* Close button is outside the rotating stack */}
                <PolaroidClose onClick={(e) => { e.stopPropagation(); onClose(); }} />

                <div className="absolute inset-0 cursor-pointer" onClick={handleNext}>
                  
                   {/* CARD 3 (Bottom) -> Becomes Middle */}
                   <PolaroidCard 
                      slide={slideBot}
                      zIndex="z-10"
                      transitionClass={isAnimating ? "transition-transform duration-500 ease-out" : ""}
                      transformClass={isAnimating 
                        ? "scale-[0.92] rotate-[2deg] translate-y-3" // Move to Mid pos
                        : "scale-[0.85] rotate-[-3deg] translate-y-6 opacity-0" // Static Bot pos
                      } 
                      opacityClass={isAnimating ? "opacity-100" : "opacity-0"}
                   />

                  {/* CARD 2 (Middle) -> Becomes Top */}
                  <PolaroidCard 
                    slide={slideMid}
                    zIndex="z-20"
                    transitionClass={isAnimating ? "transition-transform duration-500 ease-out" : ""}
                    transformClass={isAnimating 
                      ? "scale-100 rotate-0 translate-y-0" // Move to Top pos
                      : "scale-[0.92] rotate-[2deg] translate-y-3" // Static Mid pos
                    }
                  />

                  {/* CARD 1 (Top) -> Flies Away */}
                  <PolaroidCard 
                    slide={slideTop}
                    zIndex="z-30"
                    transitionClass={isAnimating ? "transition-all duration-400 ease-in" : ""} 
                    transformClass={isAnimating 
                      ? "translate-x-[120%] -translate-y-[10%] rotate-[25deg]" // Fly away
                      : "scale-100 rotate-0 translate-y-0 hover:-translate-y-1 transition-transform duration-300" // Static Top
                    }
                    opacityClass={isAnimating ? "opacity-0" : "opacity-100"}
                  />
               </div>
             </div>
             <p className="mt-12 text-stone-400 font-bold text-sm tracking-widest uppercase animate-pulse">
               Tap to Shuffle • {activeIndex + 1} / {slides.length}
             </p>
          </div>
        );
      };

      // --- STYLE 4: Blog / 博客样式 ---
      const StyleScroll = ({ onClose }) => {
        return (
          <div className="relative flex flex-col bg-white h-[85vh] w-full rounded-xl overflow-hidden shadow-2xl">
            <BlogClose onClick={onClose} />
            <div className="relative h-[45%] shrink-0 bg-gray-100">
               <Carousel className="w-full h-full" arrowClass="top-1/2" />
               <div className="absolute inset-0 bg-gradient-to-t from-white via-transparent to-transparent pointer-events-none"></div>
            </div>
            <div className="flex-1 overflow-y-auto px-8 sm:px-16 py-8 custom-scrollbar">
              <div className="max-w-4xl mx-auto">
                <div className="mb-6 border-l-8 border-amber-400 pl-6">
                  <h2 className="text-4xl font-bold text-gray-900 mb-2">{CONTENT_CONFIG.title}</h2>
                  <p className="text-gray-500 text-sm uppercase tracking-widest">Travel Log • 2024</p>
                </div>
                <p className="text-xl text-gray-700 leading-8 font-serif mb-8">
                  {CONTENT_CONFIG.description}
                </p>
                <div className="w-full h-px bg-gray-100 my-8"></div>
                <div className="text-gray-600 space-y-6 text-lg leading-relaxed pb-12">
                   {/* Handle formatting for long content */}
                   {CONTENT_CONFIG.longContent.split('\n').map((line, i) => (
                      <p key={i} className="min-h-[1em]">{line}</p>
                   ))}
                </div>
              </div>
            </div>
          </div>
        );
      };

      // --- STYLE 5: Split / 左右分栏 (Pure) ---
      const StyleSplit = ({ onClose }) => (
        <div className="relative flex flex-col md:flex-row h-[600px] w-full bg-white rounded-xl shadow-2xl overflow-hidden">
          <div className="w-full md:w-1/2 h-1/2 md:h-full relative">
            <Carousel className="w-full h-full" arrowClass="top-1/2" />
          </div>
          <div className="w-full md:w-1/2 h-1/2 md:h-full p-8 md:p-12 flex flex-col relative bg-white">
            <SimpleClose onClick={onClose} />
            <div className="flex-1 flex flex-col justify-center">
              <h2 className="text-4xl font-extrabold text-stone-800 mb-4">{CONTENT_CONFIG.title}</h2>
              <div className="w-16 h-1 bg-rose-400 mb-8"></div>
              <p className="text-stone-600 text-lg leading-8">
                {CONTENT_CONFIG.description}
              </p>
            </div>
            <div className="mt-auto pt-8 border-t border-stone-100 flex justify-between items-center text-stone-400 text-xs uppercase tracking-wider">
               <span>Gallery Collection</span>
               <span>05 / 2024</span>
            </div>
          </div>
        </div>
      );

      // --- STYLE 6: Overlay / 层叠 (Draggable) ---
      const StyleOverlay = ({ onClose }) => {
        const [sheetHeight, setSheetHeight] = useState(40); // Initial height %
        const isDragging = useRef(false);
        const startY = useRef(0);
        const startHeight = useRef(0);

        const handlePointerDown = (e) => {
          isDragging.current = true;
          startY.current = e.clientY;
          startHeight.current = sheetHeight;
          e.currentTarget.setPointerCapture(e.pointerId);
        };

        const handlePointerMove = (e) => {
          if (!isDragging.current) return;
          const deltaY = startY.current - e.clientY;
          const containerHeight = 650; 
          const deltaPercent = (deltaY / containerHeight) * 100;
          const newHeight = Math.min(Math.max(startHeight.current + deltaPercent, 20), 85);
          setSheetHeight(newHeight);
        };

        const handlePointerUp = (e) => {
          isDragging.current = false;
        };

        // Arrow stays centered in the visible part of image
        const arrowTopPos = (100 - sheetHeight) / 2;

        return (
          <div className="relative h-[650px] w-full max-w-2xl bg-transparent flex flex-col shadow-none overflow-hidden rounded-3xl border border-white/20">
            <div className="absolute inset-0 z-0 bg-stone-900">
               <Carousel 
                 className="w-full h-full" 
                 indicatorClass="top-8" 
                 arrowStyle={{ top: `${arrowTopPos}%` }} 
               />
            </div>
            <div 
              className="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.2)] flex flex-col transition-all duration-75 ease-linear z-10"
              style={{ height: `${sheetHeight}%` }}
            >
               {/* Drag Handle */}
               <div 
                 className="w-full p-4 flex justify-center cursor-ns-resize touch-none"
                 onPointerDown={handlePointerDown}
                 onPointerMove={handlePointerMove}
                 onPointerUp={handlePointerUp}
                 onPointerCancel={handlePointerUp}
               >
                 <div className="w-16 h-1.5 bg-stone-300 rounded-full"></div>
               </div>

               <OverlayClose onClick={onClose} />

               <div className="flex-1 overflow-y-auto px-8 pb-8 noselect">
                  <span className="inline-block px-3 py-1 bg-blue-50 text-blue-500 rounded-full text-xs font-bold mb-3 tracking-wide">
                    FEATURED
                  </span>
                  <h2 className="text-3xl font-black text-stone-800 mb-4 leading-tight">
                    {CONTENT_CONFIG.title}
                  </h2>
                  <p className="text-stone-500 text-base leading-7">
                    {CONTENT_CONFIG.description}
                    <br/><br/>
                    {CONTENT_CONFIG.longContent}
                  </p>
               </div>
            </div>
          </div>
        );
      };

      // ----------------------------------------------------------------------------------
      // 4. Main Application Wrapper
      // ----------------------------------------------------------------------------------

      // Modal Container that handles entrance/exit animations
      const Modal = ({ isOpen, onClose, styleType }) => {
        const [show, setShow] = useState(false);
        const [render, setRender] = useState(false);
        const [activeStyle, setActiveStyle] = useState(styleType);

        useEffect(() => {
          if (isOpen && styleType) {
            setActiveStyle(styleType);
            setRender(true);
            requestAnimationFrame(() => requestAnimationFrame(() => setShow(true)));
          } else {
            setShow(false);
            const timer = setTimeout(() => { setRender(false); }, 400); 
            return () => clearTimeout(timer);
          }
        }, [isOpen, styleType]);

        if (!render) return null;

        let ContentComponent;
        let containerClass = "max-w-4xl"; 
        let wrapperStyles = "bg-transparent";
        
        // Preserve style during closing animation
        const styleToRender = isOpen ? styleType : activeStyle;

        switch (styleToRender) {
          case 1: 
            ContentComponent = StyleBlank; 
            break;
          case 2: 
            ContentComponent = StyleClassic; 
            containerClass="max-w-3xl"; 
            break; 
          case 3: 
            ContentComponent = StylePolaroid; 
            containerClass="max-w-none w-auto bg-transparent shadow-none"; 
            break; 
          case 4: 
            ContentComponent = StyleScroll; 
            containerClass="max-w-6xl w-[95vw]"; 
            break;
          case 5:
            ContentComponent = StyleSplit;
            containerClass="max-w-5xl";
            break;
          case 6:
            ContentComponent = StyleOverlay;
            containerClass="max-w-2xl w-full bg-transparent shadow-none"; 
            break;
          default: 
            ContentComponent = StyleClassic;
        }

        const scaleEffect = show ? 'scale-100 opacity-100' : 'scale-90 opacity-0';

        return (
          <div 
            className={`fixed inset-0 z-40 flex items-center justify-center p-4 sm:p-8 transition-all duration-500
              ${show ? 'bg-stone-900/60 backdrop-blur-sm' : 'bg-black/0 backdrop-blur-none pointer-events-none'}`}
            onClick={onClose}
          >
            <div 
              className={`modal-content relative w-full ${containerClass} ${wrapperStyles} transform transition-all duration-500 ${scaleEffect}`}
              onClick={e => e.stopPropagation()}
            >
              <ContentComponent onClose={onClose} />
            </div>
          </div>
        );
      };

      // App Entry Point
      const App = () => {
        const [activeStyle, setActiveStyle] = useState(null);

        const styleOptions = [
          { id: 1, icon: Square, name: "Style 1: Blank", nameJa: "スタイル 1: 空白", desc: "Large canvas for custom work", color: "hover:border-stone-400" },
          { id: 2, icon: LayoutTemplate, name: "Style 2: Classic", nameJa: "スタイル 2: カード", desc: "Standard Layout (Rounded)", color: "hover:border-blue-400" },
          { id: 3, icon: Camera, name: "Style 3: Polaroid", nameJa: "スタイル 3: チェキ風", desc: "Cute Photo Stack Animation", color: "hover:border-rose-400" },
          { id: 4, icon: ScrollText, name: "Style 4: Blog", nameJa: "スタイル 4: ブログ", desc: "Immersive Wide Layout", color: "hover:border-emerald-400" },
          { id: 5, icon: Columns, name: "Style 5: Split", nameJa: "スタイル 5: 左右分割", desc: "Half Image, Half Text (Elegant)", color: "hover:border-indigo-400" },
          { id: 6, icon: Layers, name: "Style 6: Overlay", nameJa: "スタイル 6: 重ね合わせ", desc: "Draggable Bottom Sheet", color: "hover:border-orange-400" },
        ];

        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-6 font-sans text-gray-800 bg-stone-100">
            
            <div className="text-center mb-12 max-w-2xl">
              <h1 className="text-5xl font-extrabold mb-4 tracking-tight text-stone-800">UI Kit Gallery</h1>
              <p className="text-stone-500 text-lg">
                テンプレートを選んでポップアップを作成。<br/>
                内容・デザインは自由に変えられます。<br/>
                <span className="text-sm opacity-70"> 选模板做弹窗,特殊弹窗用第一个改。（所有内容样式都可以改）<br/></span>
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-6xl">
              {styleOptions.map((style) => (
                <button
                  key={style.id}
                  onClick={() => setActiveStyle(style.id)}
                  className={`relative flex items-center gap-4 p-6 bg-white rounded-2xl border-2 border-transparent shadow-sm transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 ${style.color} group text-left`}
                >
                  <div className="p-3 bg-stone-100 rounded-full text-stone-600 group-hover:bg-stone-800 group-hover:text-white transition-colors shrink-0">
                    <style.icon size={24} />
                  </div>
                  <div className="min-w-0">
                    <h3 className="font-bold text-lg mb-0.5 truncate">{style.name}</h3>
                    <p className="text-xs font-bold text-stone-400 mb-1 uppercase tracking-wide truncate">{style.nameJa}</p>
                    <p className="text-xs text-stone-500 truncate">{style.desc}</p>
                  </div>
                </button>
              ))}
            </div>

            <Modal 
              isOpen={activeStyle !== null} 
              onClose={() => setActiveStyle(null)} 
              styleType={activeStyle} 
            />

          </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
