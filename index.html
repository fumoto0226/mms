<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mm's新宿ザイリュウログ</title>
<link rel="icon" href="img/web-logo.svg" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #d8d8d8;
  }

  /* 加载界面样式 */
  #loading-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #d8d8d8;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }

  #loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 32px 28px;
  }

  .loading-gif {
    width: 360px;
    height: auto;
  }

  .progress-container {
    width: 260px;
    height: 10px;
    background: #ededed;
    border: 1px solid #b5b5b5;
    display: block;
    overflow: hidden;
  }

  .progress-bar {
    width: 0%;
    height: 100%;
    background: #2d2d2d;
    transition: width 0.25s ease-out;
  }

  .loading-text {
    color: #111;
    font-size: 14px;
    letter-spacing: 0.05em;
    font-family: 'DotGothic16', 'Noto Sans JP', sans-serif;
  }

  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* —— 两层背景：与网格同一缩放逻辑 —— */
  .bg-layer {
    position: absolute;
    top: 50%;
    left: 50%;
    aspect-ratio: calc(23 / 12);
    height: 100vh;
    transform: translate(-50%, -50%);
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 220ms ease;
    will-change: opacity;
    pointer-events: none;
  }
  @media (min-aspect-ratio: 23/12) {
    .bg-layer { width: 100vw; height: auto; }
  }
  #bgA { z-index: 0; opacity: 1; }
  #bgB { z-index: 1; opacity: 0; }

  /* —— 网格：同样比例 + 外圈禁用 —— */
  #grid {
    position: absolute;
    top: 50%;
    left: 50%;
    aspect-ratio: calc(23 / 12);
    height: 100vh;
    transform: translate(-50%, -50%);
    display: grid;
    grid-template-columns: repeat(23, 1fr);
    grid-template-rows: repeat(12, 1fr);
    z-index: 2;
  }
  @media (min-aspect-ratio: 23/12) {
    #grid { width: 100vw; height: auto; }
  }
  #grid div {
    border: none; /* 隐藏网格线 */
    /* 去掉 hover 高亮 */
  }
  #grid div.disabled {
    background-color: transparent;
    pointer-events: none;
  }

  /* AI识别框样式 */
  .ai-detection-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
    display: none; /* 隐藏AI识别框 */
  }

  .ai-region {
    position: absolute;
    pointer-events: none;
  }

  /* —— UI 覆盖层（贴在背景上的UI） —— */
  #uiOverlay {
    position: absolute;
    left: 0; top: 0;
    pointer-events: none; /* 默认不拦截事件 */
    z-index: 20; /* 高于网格与AI识别框 */
  }
  
  #uiOverlay .menu {
    pointer-events: auto; /* 菜单可以接收鼠标事件 */
  }
  #uiOverlay img#logo {
    position: absolute;
    width: 260px; /* 实际尺寸由JS按比例缩放 */
  }
  #uiOverlay .menu div {
    position: absolute;
    width: 160px;
    padding: 8px 8px 8px 8px;
    background: #000;
    color: #fff;
    font-weight: bold;
    text-align: center;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 2px solid transparent;
    border-radius: 4px; 
    user-select: none;
  }
  
  #uiOverlay .menu div:hover {
    background: #333;
    border-color: #fff;
    transform: scale(1.05);
  }
  
  #uiOverlay .menu div:active {
    background: #555;
    transform: scale(0.95);
  }
  
  #uiOverlay .menu div.clicked {
    background: #666;
    border-color: #00ff88;
    box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
  }
  #uiOverlay #version {
    position: absolute;
    font-size: 12px;
    color: #fff;
    opacity: 0.8;
    font-weight: 500; /* 增加字重，从默认变为半粗体 */
  }

  .ai-box {
    position: absolute;
    border: 2px solid var(--region-color);
    background: transparent;
    box-sizing: border-box;
    transform-origin: center;
    opacity: 0;
    animation: expandBox 0.8s ease-out forwards;
  }

  .ai-label {
    position: absolute;
    left: -2px;
    top: -1.5em;
    padding: 2px 6px;
    background: var(--region-color);
    color: rgb(0, 0, 0);
    font-weight: bold;
    font-size: 12px;
    font-family: Arial, sans-serif;
    border-radius: 2px;
    opacity: 0;
    animation: showLabel 1s ease-out 0.8s forwards;
    white-space: nowrap;
    transform: translateY(-5px);
  }

  .ai-label-text {
    display: inline-block;
    min-width: 1ch;
  }

  @keyframes expandBox {
    from { 
      transform: scale(0); 
      opacity: 0; 
    }
    to { 
      transform: scale(1); 
      opacity: 1; 
    }
  }

  @keyframes showLabel {
    from { 
      opacity: 0; 
      transform: translateY(-5px);
    }
    to { 
      opacity: 1; 
      transform: translateY(0);
    }
  }

  /* 识别框脉冲效果 - 简单的透明度变化 */
  .ai-box {
    animation: expandBox 0.8s ease-out forwards, pulse 2s ease-in-out infinite 0.8s;
  }

  @keyframes pulse {
    0%, 100% { 
      opacity: 1;
    }
    50% { 
      opacity: 0.7;
    }
  }
</style>

let loadingMessageIndex = 0;
let loadingMessageTimer = null;

/** 渲染当前加载提示文案 */
function renderLoadingText(progress) {
  const safeProgress = Number.isFinite(progress) ? progress : 0;
  loadingText.textContent = `${loadingMessages[loadingMessageIndex]} ${safeProgress}%`;
}

/** 启动加载文案轮播（每5秒切换一条） */
function startLoadingMessageRotation() {
  renderLoadingText(0);
  loadingMessageTimer = setInterval(() => {
    loadingMessageIndex = (loadingMessageIndex + 1) % loadingMessages.length;
    const safeTotal = Math.max(totalImages, 1);
    const progress = Math.round((loadedImages / safeTotal) * 100);
    renderLoadingText(progress);
  }, 5000);
}

/** 停止轮播，防止组件卸载后仍在运行 */
function stopLoadingMessageRotation() {
  if (loadingMessageTimer) {
    clearInterval(loadingMessageTimer);
    loadingMessageTimer = null;
  }
}

/** 预加载图片，确保切换前一定已就绪 */
function preload(url) {
  // 如果图片已经在持久化缓存中，直接返回
  if (imageCache.has(url)) {
    return Promise.resolve(imageCache.get(url));
  }
  
  // 如果正在加载中，返回现有的Promise
  if (cache.has(url)) {
    return cache.get(url);
  }
  
  const p = new Promise((resolve, reject) => {
    const img = new Image();
    img.src = url;
    
    img.onload = () => {
      // 将图片对象保存到持久化缓存
      imageCache.set(url, img);
      cache.delete(url); // 从临时缓存中删除
      
      if (isPreloading) {
        loadedImages++;
        updateProgress();
      }
      resolve(img);
    };
    
    img.onerror = () => {
      cache.delete(url);
      if (isPreloading) {
        loadedImages++;
        updateProgress();
      }
      reject(new Error(`Failed to load ${url}`));
    };
    
    // 尝试更可靠的 decode（更少闪烁）
    if ('decode' in img) {
      img.decode().catch(() => {
        // decode失败时依赖onload事件
      });
    }
  });
  
  cache.set(url, p);
  return p;
}

/** 更新加载进度 */
function updateProgress() {
  const safeTotal = Math.max(totalImages, 1);
  const progress = Math.round((loadedImages / safeTotal) * 100);
  progressBar.style.width = progress + '%';
  renderLoadingText(progress);
  
  if (loadedImages >= totalImages) {
    setTimeout(() => {
      showMainInterface();
    }, 500); // 延迟500ms显示主界面
  }
}

/** 显示主界面 */
function showMainInterface() {
  loadingScreen.classList.add('hidden');
  container.style.display = 'block';
  isPreloading = false;
  stopLoadingMessageRotation();
  
  // 确保初始背景已设置
  bgA.style.backgroundImage = 'url(home-webp/0-0.webp)';
  bgB.style.backgroundImage = 'url(home-webp/0-0.webp)';
  
  // 输出缓存状态信息
  console.log(`图片缓存完成: ${imageCache.size} 张图片已缓存`);
}

/** 验证缓存状态 */
function validateCache() {

  console.log(`临时缓存状态: ${cache.size} 个加载中`);
}

// 启动加载文案轮播
startLoadingMessageRotation();

/** 切换背景：仅在新图完全加载后才淡入，并且只响应最后一次请求 */
async function switchTo(url) {
  const mySeq = ++requestSeq;
  try {
    // 确保图片已加载并缓存
    const img = await preload(url);
    
    // 期间如果又来了更新请求，就放弃这次切换
    if (mySeq !== requestSeq) return;

    // 验证图片对象是否有效
    if (!img || !img.complete) {
      console.warn('Image not ready:', url);
      return;
    }

    // 先把新图放到隐藏层，但仍保持隐藏层 opacity=0
    hidden.style.backgroundImage = `url(${url})`;
    
    // 强制重绘，确保图片已渲染
    hidden.offsetHeight;

    // 再开始交叉淡入（旧图始终可见直到此刻）
    hidden.style.opacity = '1';
    showing.style.opacity = '0';

    // 监听一次过渡结束后交换角色
    const done = new Promise(res => {
      const handler = () => {
        hidden.removeEventListener('transitionend', handler);
        res();
      };
      hidden.addEventListener('transitionend', handler);
    });
    await done;

    // 交换层引用，确保下一次切换仍然平滑
    const tmp = showing; showing = hidden; hidden = tmp;
  } catch (e) {
    // 加载失败时保持当前画面不变（不闪黑）
    console.warn('Image load failed:', url, e);
  }
}

// —— UI 覆盖层布局（与背景一致的 aspect-fill 逻辑） ——
const uiBaseWidth = 1920;
const uiBaseHeight = 960;
function layoutUI() {
  if (!uiOverlay) return;
  const W = window.innerWidth;
  const H = window.innerHeight;
  const scale = Math.max(W / uiBaseWidth, H / uiBaseHeight);
  const viewW = uiBaseWidth * scale;
  const viewH = uiBaseHeight * scale;
  const offsetX = (W - viewW) / 2;
  const offsetY = (H - viewH) / 2;

  // 容器尺寸与位置
  uiOverlay.style.width = `${viewW}px`;
  uiOverlay.style.height = `${viewH}px`;
  uiOverlay.style.left = `${offsetX}px`;
  uiOverlay.style.top = `${offsetY}px`;

  // logo
  const logo = document.getElementById('logo');
  if (logo) {
    logo.style.left = `${950 * scale}px`;//位置
    logo.style.top = `${60 * scale}px`;
    logo.style.width = `${860 * scale}px`;//大小
  }

  // 菜单（黑底白字按钮）
  const menuItems = uiOverlay.querySelectorAll('.menu div');
  const baseY = 350; // 起始 y 坐标（基于 1920×960）
  const step = 76;   // 每项间隔
  const menuX = 1560; // 🎯 菜单位置 X 坐标（从 1650 改为 1500，往左移动 150px）
  menuItems.forEach((m, i) => {
    m.style.left = `${menuX * scale}px`; // 🎯 修改位置：往左移动
    m.style.top = `${(baseY + i * step) * scale}px`;
    m.style.width = `${160 * scale}px`;
    m.style.fontSize = `${20 * scale}px`;
  });

  // 版本号
  const version = document.getElementById('version');
  if (version) {
    version.style.left = `${1560 * scale}px`;
    version.style.top = `${880 * scale}px`;
    version.style.fontSize = `${16 * scale}px`;
  }
}


// 离开网格恢复默认图（同样等加载好再切）

/** 生成所有需要预加载的图片URL */
function generateAllImageUrls() {
  const urls = ['home-webp/0-0.webp']; // 默认图片（首页背景）
  
  // 生成所有网格区域的图片URL
  for (let r = 2; r <= 11; r++) {
    for (let c = 2; c <= 22; c++) {
      urls.push(`home-webp/${r}-${c}.webp`);
    }
  }
  
  return urls;
}

/** 开始预加载所有图片 */
async function preloadAllImages() {
  // 仅提前缓存首页背景图片（home 目录），不拉取其他页面资源
  const allUrls = generateAllImageUrls();
  totalImages = allUrls.length;
  loadedImages = 0;
  
  loadingText.textContent = `搭載画像 ${totalImages} 枚をスキャン中...`;
  
  // 批量预加载全部首页背景
  const preloadPromises = allUrls.map(url =>

}

// 简化的区域处理函数

// 乱码字符集
const garbledChars = "@#¥%*&!?$^~`|\\/<>{}[]()+=_-";

/**
 * 生成随机乱码文字
 * @param {string} targetText 目标文字
 * @param {number} length 乱码长度
 * @returns {string} 乱码文字
 */
function generateGarbledText(targetText, length) {
  let garbled = '';
  for (let i = 0; i < length; i++) {
    garbled += garbledChars[Math.floor(Math.random() * garbledChars.length)];
  }
  return garbled;
}

/**
 * 文字从乱码变为正确文字的动画
 * @param {HTMLElement} textElement 文字元素
 * @param {string} targetText 目标文字
 * @param {number} duration 动画持续时间（毫秒）
 */
function animateTextReveal(textElement, targetText, duration = 1000) {
  const textLength = targetText.length;
  const interval = duration / (textLength * 3); // 每个字符刷新3次
  
  let currentIndex = 0;
  let animationFrame = 0;
  
  const animate = () => {
    if (currentIndex < textLength) {
      // 生成当前进度的乱码文字
      const garbledLength = Math.max(1, textLength - currentIndex);
      const garbledText = generateGarbledText(targetText, garbledLength);
      const revealedText = targetText.substring(0, currentIndex);
      
      textElement.textContent = revealedText + garbledText;
      
      // 每3帧更新一次字符
      if (animationFrame % 3 === 0) {
        currentIndex++;
      }
      animationFrame++;
      
      requestAnimationFrame(animate);
    } else {
      // 动画结束，显示最终文字
      textElement.textContent = targetText;
    }
  };
  
  animate();
}


/**
 * 创建AI识别框
 * @param {Object} region 区域数据
 * @param {number} delay 延迟时间（毫秒）
 */
function createAIRegion(region, delay = 0) {
  setTimeout(() => {
    // 创建区域容器
    const regionElement = document.createElement('div');
    regionElement.className = 'ai-region';
    regionElement.style.left = region.x + 'px';
    regionElement.style.top = region.y + 'px';
    regionElement.style.setProperty('--region-color', region.color);
    
    // 创建识别框
    const boxElement = document.createElement('div');
    boxElement.className = 'ai-box';
    boxElement.style.width = region.width + 'px';
    boxElement.style.height = region.height + 'px';
    
    // 创建标签
    const labelElement = document.createElement('div');
    labelElement.className = 'ai-label';
    
    const labelTextElement = document.createElement('span');
    labelTextElement.className = 'ai-label-text';
    labelElement.appendChild(labelTextElement);
    
    // 组装元素
    regionElement.appendChild(boxElement);
    regionElement.appendChild(labelElement);
    aiDetectionContainer.appendChild(regionElement);
    
    // 启动文字动画（延迟1.2秒，等框动画完成）
    setTimeout(() => {
      animateTextReveal(labelTextElement, region.name, 800);
    }, 1200);
    
  }, delay);
}

/**
 * 显示指定区域的AI识别框
 * @param {string} regionKey 区域键名（如"11-16"或"11-15"）
 * @param {number} staggerDelay 每个框之间的延迟（毫秒）
 */
function showAIRegions(regionKey, staggerDelay = 300) {
  // 清空现有识别框
  aiDetectionContainer.innerHTML = '';
  
  // 获取指定区域的识别框数据
  const regionData = regions[regionKey];
  if (!regionData) {
    console.warn(`Region ${regionKey} not found`);
    return;
  }
  
  // 依次创建识别框
  regionData.forEach((region, index) => {
    createAIRegion(region, index * staggerDelay);
  });
}

function showAllAIRegions(staggerDelay = 300) {

}

/**

}
