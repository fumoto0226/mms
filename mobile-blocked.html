<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCでご覧ください</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #7b7b7b;
      --panel: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.22);
      --text: #f6f6f6;
      --muted: rgba(246, 246, 246, 0.86);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.12), transparent 45%),
        linear-gradient(180deg, #8a8a8a 0%, var(--bg) 52%, #686868 100%);
      color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .notice {
      width: min(100%, 420px);
      padding: 32px 24px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(30px, 9vw, 38px);
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.9;
      color: var(--muted);
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <main class="notice" aria-labelledby="mobile-blocked-title">
    <h1 id="mobile-blocked-title">PCでご覧ください</h1>
    <p>このサイトは
PC環境での閲覧を推奨しております。

より良い体験のため、
パソコンからアクセスしてください。</p>
  </main>
</body>
</html>
